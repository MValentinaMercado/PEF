# Configuración de SonarQube Cloud (la usa el pipeline y la ventana Calidad).
# Las dos claves no son secretas; el token va en el secret SONAR_TOKEN.
sonar.organization=mvalentinamercado
sonar.projectKey=MValentinaMercado_PEF
sonar.projectName=Planificador inteligente de rutas

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Código de la aplicación y pruebas.
sonar.sources=api,rutas,web,main.py
sonar.tests=tests

# Informe que genera pytest --cov-report=xml en el pipeline.
sonar.python.coverage.reportPaths=coverage.xml
