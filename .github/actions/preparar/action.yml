name: Preparar entorno
description: Instala Python y las dependencias del proyecto (etapa 2 del pipeline).

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Instalar dependencias
      shell: bash
      run: |
        python -m pip install -r requirements.txt
        # Evidencia de reproducibilidad: versiones exactas de esta corrida.
        python -m pip freeze > requirements-resuelto.txt
