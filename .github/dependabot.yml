version: 2
updates:
  # Alertas y propuestas de actualización de las dependencias de Python.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  # Versiones de las acciones usadas por el pipeline (el workflow y la
  # acción compuesta que prepara el entorno).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/preparar
    schedule:
      interval: weekly
